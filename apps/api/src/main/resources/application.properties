spring.application.name=ptit-one-api
server.port=${SERVER_PORT:8080}

# Profile mac dinh KHONG noi database.
#
# Nho vay nguoi chua cai SQL Server van chay duoc API de dung frontend, va
# HttpSmokeTest khoi dong duoc ma khong can DB. Profile `central` bat lai
# DataSource — xem application-central.properties.
#
# Ten class theo Spring Boot 4: autoconfiguration da doi sang package rieng
# cua tung module (boot 3 la org.springframework.boot.autoconfigure.jdbc).
# Ghi sai ten thi ung dung khong khoi dong, bao "not auto-configuration classes".
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# Auth (A0). Khoa ky JWT CHI o profile central, doc tu PTITONE_JWT_SECRET.
ptitone.auth.access-ttl=PT15M
ptitone.auth.session-ttl=P7D
# Bat khi chay HTTPS de cookie co co Secure.
ptitone.auth.cookie-secure=${PTITONE_COOKIE_SECURE:false}

# OpenAPI + Swagger UI. Spec sinh tu controller/DTO nen khong the lech voi code.
# Tat o moi truong khong phai may dev: SPRINGDOC_APIDOCS_ENABLED=false.
springdoc.api-docs.enabled=${SPRINGDOC_APIDOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Try-it-out voi double-submit CSRF: springdoc doc cookie roi gan vao header.
# Thieu ba dong nay thi MOI POST/PUT trong Swagger UI tra 403 CSRF_INVALID —
# cookie van duoc gui tu dong, nhung header thi khong ai gan.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

# Nhom endpoint theo thu tu doc duoc thay vi thu tu nap bean.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Gui thu (A1) qua Brevo. Co API key thi goi API HTTP, khong thi SMTP relay.
# From trong, hoac thieu ca API key lan Host, thi tat gui thu: cac tinh nang
# can mail bao "chua bat" thay vi gia vo da gui. Gia tri that o .env.
ptitone.mail.brevo-api-key=${PTITONE_BREVO_API_KEY:}
ptitone.mail.host=${PTITONE_MAIL_HOST:}
ptitone.mail.port=${PTITONE_MAIL_PORT:587}
ptitone.mail.username=${PTITONE_MAIL_USERNAME:}
ptitone.mail.password=${PTITONE_MAIL_PASSWORD:}
ptitone.mail.from=${PTITONE_MAIL_FROM:}
ptitone.mail.from-name=${PTITONE_MAIL_FROM_NAME:PTIT One}

# Anh dai dien luu o Cloudinary, DB chi giu URL (SinhVien.AnhDaiDien, V8).
# Cloud name trong thi tat tai anh: POST /api/me/avatar tra 503 thay vi gia vo
# da luu. API secret CHI o server, khong bao gio gui xuong trinh duyet.
ptitone.cloudinary.cloud-name=${PTITONE_CLOUDINARY_CLOUD_NAME:}
ptitone.cloudinary.api-key=${PTITONE_CLOUDINARY_API_KEY:}
ptitone.cloudinary.api-secret=${PTITONE_CLOUDINARY_API_SECRET:}
ptitone.cloudinary.folder=${PTITONE_CLOUDINARY_FOLDER:ptitone/avatar}

# Tran kich thuoc anh dai dien. 5MB du cho anh the chup bang dien thoai; cao hon
# chi ton bang thong va thoi gian cho, vi anh se bi thu nho khi hien thi.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
