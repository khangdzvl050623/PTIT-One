spring.application.name=ptit-one-api
server.port=${SERVER_PORT:8080}

# Profile mac dinh KHONG noi database.
#
# Nho vay nguoi chua cai SQL Server van chay duoc API de dung frontend, va
# HttpSmokeTest khoi dong duoc ma khong can DB. Profile `central` bat lai
# DataSource — xem application-central.properties.
#
# Ten class theo Spring Boot 4: autoconfiguration da doi sang package rieng
# cua tung module (boot 3 la org.springframework.boot.autoconfigure.jdbc).
# Ghi sai ten thi ung dung khong khoi dong, bao "not auto-configuration classes".
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# Auth (A0). Khoa ky JWT CHI o profile central, doc tu PTITONE_JWT_SECRET.
ptitone.auth.access-ttl=PT15M
ptitone.auth.session-ttl=P7D
# Bat khi chay HTTPS de cookie co co Secure.
ptitone.auth.cookie-secure=${PTITONE_COOKIE_SECURE:false}
