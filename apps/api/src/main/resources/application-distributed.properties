# Profile `distributed` — Phan 2: BON database, dinh tuyen theo co so.
#
# Bat bang: SPRING_PROFILES_ACTIVE=central,distributed
#
#   `central`      giu nguyen moi bean nghiep vu cua Phan 1.
#   `distributed`  thay mot DataSource bang RoutingDataSource bon nut.
#
# Hai profile nay BO SUNG cho nhau, khong thay the nhau. Bat moi `distributed`
# thi khong con controller nao ca.
#
# Gia tri that nam o bien moi truong, khong o file nay. File nay duoc commit.

# Khong de Spring Boot tu dung DataSource tu spring.datasource.*:
# RoutingDataSourceConfig tu dung lay bon pool roi gop sau RoutingDataSource.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# Flyway TAT o che do phan tan. Luoc do cac site do db/site/ quan ly, va danh
# muc o Master do replication day xuong — API khong duoc tu doi schema cua
# bon database dung chung.
spring.flyway.enabled=false

# --- Nut danh muc -----------------------------------------------------------
# Cung la noi mac dinh khi chua biet co so: dang nhap phai tra DanhBaNguoiDung
# o day moi biet nguoi dung thuoc co so nao.
ptitone.sites.master.url=${PTITONE_MASTER_URL}
ptitone.sites.master.username=${PTITONE_MASTER_USERNAME}
ptitone.sites.master.password=${PTITONE_MASTER_PASSWORD}

# --- Ba co so van hanh ------------------------------------------------------
# Moi co so mot tai khoan rieng: chung la may khac nhau, do nguoi khac nhau
# quan. Khong gia dinh dung chung mot mat khau.
ptitone.sites.nodes.HCM.url=${PTITONE_HCM_URL}
ptitone.sites.nodes.HCM.username=${PTITONE_HCM_USERNAME}
ptitone.sites.nodes.HCM.password=${PTITONE_HCM_PASSWORD}

ptitone.sites.nodes.HN.url=${PTITONE_HN_URL}
ptitone.sites.nodes.HN.username=${PTITONE_HN_USERNAME}
ptitone.sites.nodes.HN.password=${PTITONE_HN_PASSWORD}

ptitone.sites.nodes.DN.url=${PTITONE_DN_URL}
ptitone.sites.nodes.DN.username=${PTITONE_DN_USERNAME}
ptitone.sites.nodes.DN.password=${PTITONE_DN_PASSWORD}

# So ket noi toi da cho MOI nut. Nho thoi: bon pool nhan len thi tong so ket
# noi tang nhanh, ma tai cua do an thi nhe.
ptitone.sites.pool-size=${PTITONE_SITE_POOL_SIZE:5}

# Khoa ky access JWT va khoa HMAC cho ma 6 so — giong profile central.
ptitone.auth.jwt-secret=${PTITONE_JWT_SECRET}
ptitone.auth.otp-secret=${PTITONE_OTP_SECRET}
