# Profile `central` — Phan 1: MOT database tap trung, MOT DataSource.
#
# Bat bang: SPRING_PROFILES_ACTIVE=central trong apps/api/.env, roi chay
# .\scripts\dev-api.ps1 tu goc repo. Chay thang mvnw thi khong nap .env.
#
# Gia tri that nam o bien moi truong, khong o file nay. File nay duoc commit.

# Go bo loai tru cua profile mac dinh de DataSource duoc cau hinh lai.
spring.autoconfigure.exclude=

spring.datasource.url=${PTITONE_DB_URL}
spring.datasource.username=${PTITONE_DB_USERNAME}
spring.datasource.password=${PTITONE_DB_PASSWORD}
spring.datasource.hikari.pool-name=ptitone-central

# Ung dung van khoi dong duoc khi SQL Server dang tat; /api/health/db se bao
# DOWN thay vi ca API chet luc boot. Bat buoc theo rang buoc thiet ke.
spring.datasource.hikari.initialization-fail-timeout=-1

# Migration TAT mac dinh: API khong duoc tu doi schema cua DB dung chung.
# Bat co chu dich mot lan bang PTITONE_MIGRATE_ON_START=true voi tai khoan
# migration rieng, xong tat lai va chay API bang tai khoan API.
spring.flyway.enabled=${PTITONE_MIGRATE_ON_START:false}
spring.flyway.locations=classpath:db/migration

# URL migration va DataSource nghiep vu PHAI tro cung mot CENTRAL — dung
# chung mot bien de khong the lech.
spring.flyway.url=${PTITONE_DB_URL}
spring.flyway.user=${PTITONE_MIGRATION_USERNAME:${PTITONE_DB_USERNAME}}
spring.flyway.password=${PTITONE_MIGRATION_PASSWORD:${PTITONE_DB_PASSWORD}}

# Khoa ky access JWT: base64 cua >= 32 byte ngau nhien. Khong co default —
# thieu bien moi truong thi API khong khoi dong, thay vi ky bang khoa doan duoc.
ptitone.auth.jwt-secret=${PTITONE_JWT_SECRET}
